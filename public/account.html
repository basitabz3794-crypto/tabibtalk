<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Tabib Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/scifi.css">
<style>
  .acct-grid { display:grid; grid-template-columns:1fr; gap:18px; }
  @media (min-width:820px){ .acct-grid { grid-template-columns: 1.2fr 1fr; } }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-soft); font-size:.92rem; }
  .kv:last-child { border-bottom:none; }
  .kv .k { color:var(--muted); } .kv .v { color:var(--text); font-weight:600; text-align:right; }
  .plan-hero { text-align:center; padding:24px; }
  .plan-hero .tier { font-family:var(--font-display); font-size:1.8rem; font-weight:700; text-transform:capitalize; background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .plan-hero .exp { color:var(--muted); font-size:.9rem; margin-top:6px; }
  .countdown { font-family:var(--font-display); font-size:1.3rem; color:var(--text); font-weight:600; margin-top:4px; }
  .proof-row { display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid var(--border-soft); }
  .proof-row:last-child { border-bottom:none; }
  h3.sec { font-family:var(--font-display); font-weight:600; font-size:1.1rem; margin:0 0 14px; color:var(--text); }
</style>
</head>
<body class="scifi">
<script>/* Apply the saved display mode BEFORE first paint so minimalist users never
see a dark flash. header.js (or the app's own module) handles live switching. */
try{if(localStorage.getItem('tt_display_mode')!=='gamify'){document.documentElement.classList.add('tt-minimal');document.body.classList.remove('scifi','tt-scifi');}}catch(e){}</script>
<div class="nebula"></div>
<canvas id="scifi-field"></canvas>

<header class="site-header" id="site-header"></header>
<div class="wrap">
  <h1 class="page-title reveal">My Account</h1>
  <div id="alert-box"></div>
  <div id="content"></div>
</div>
<script src="/js/header.js"></script>
<script src="/js/scifi.js"></script>
<script>
function fmtDate(iso){ if(!iso) return '—'; try { return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); } catch(e){ return iso; } }
function daysLeft(iso){ if(!iso) return null; const ms = new Date(iso).getTime() - Date.now(); return Math.ceil(ms/86400000); }

(async () => {
  renderHeader('account');
  enableCopyProtection();
  enableBlurOnBlur();
  const user = await getCurrentUser();
  const content = document.getElementById('content');
  if (!user) { window.location.href = '/login.html?next=/account.html'; return; }

  const params = new URLSearchParams(window.location.search);
  if (params.get('checkout') === 'success') {
    document.getElementById('alert-box').innerHTML = '<div class="alert alert-success">Payment received! Once we confirm it, your plan will activate — you\'ll see it here.</div>';
  }

  // gather proofs across methods + devices
  const [pp, ip, up] = await Promise.all([ api('/api/paypal/my-proofs'), api('/api/instapay/my-proofs'), api('/api/upi/my-proofs') ]);
  const proofs = [...pp.proofs, ...ip.proofs, ...up.proofs].sort((a,b)=> new Date(b.submittedAt)-new Date(a.submittedAt));

  const dl = daysLeft(user.planExpiresAt);
  const PLAN_LABELS = {
    'student-monthly':'Student · Monthly', 'student-6m':'Student · 6 months', 'student-12m':'Student · 12 months',
    'professional-monthly':'Professional · Monthly', 'professional-6m':'Professional · 6 months', 'professional-yearly':'Professional · 12 months',
    'lifetime':'Lifetime', 'explorer':'Explorer (free)',
    'basic-monthly':'Basic · Monthly', 'advanced-monthly':'Advanced · Monthly'
  };
  const DIALECT_NAMES = { eg: '🇪🇬 Egyptian', hejazi: '🇸🇦 Saudi (Hejazi)', khaleeji: '🌊 Gulf (Khaleeji)' };
  const planLabelFor = (planId, tier) => PLAN_LABELS[planId] || (tier ? tier.charAt(0).toUpperCase()+tier.slice(1) : 'Explorer');
  const planLabel = planLabelFor(user.planId, user.tier);
  const expiryBlock = user.tier === 'lifetime'
    ? `<div class="countdown">Lifetime — never expires</div>`
    : (user.planExpiresAt
        ? `<div class="exp">Your plan is active until</div><div class="countdown">${fmtDate(user.planExpiresAt)}</div><div class="exp">${dl>0? dl+' day'+(dl===1?'':'s')+' remaining — you\'ll need to subscribe again after this.' : 'Expired — subscribe again to regain full access.'}</div>`
        : `<div class="exp">You're on the free Explorer plan. Upgrade any time to unlock everything.</div>`);

  content.innerHTML = `
    <div class="acct-grid">
      <div class="card reveal d1">
        <h3 class="sec">Personal details</h3>
        <div class="kv"><span class="k">Name</span><span class="v">${user.name||'—'}</span></div>
        <div class="kv"><span class="k">Email</span><span class="v">${user.email}</span></div>
        <div class="kv"><span class="k">Nationality</span><span class="v">${user.nationality||'—'}</span></div>
        <div class="kv"><span class="k">Year / grade</span><span class="v">${user.grade||'—'}</span></div>
        <div class="kv"><span class="k">Phone</span><span class="v">${user.phone||'—'}</span></div>
        <div class="kv"><span class="k">College</span><span class="v">${user.college||'—'}</span></div>
        <div class="kv"><span class="k">Member since</span><span class="v">${fmtDate(user.createdAt)}</span></div>
        <div class="kv"><span class="k">Account status</span><span class="v"><span class="pill pill-${user.status==='active'?'active':'suspended'}">${user.status||'active'}</span></span></div>
      </div>
      <div class="card reveal d2">
        <h3 class="sec">Subscription</h3>
        <div class="plan-hero">
          <div class="tier">${user.tier}</div>
          <div style="color:var(--accent);font-weight:600;font-size:.9rem;margin-top:2px">${DIALECT_NAMES[user.dialect || 'eg']} &middot; ${planLabel}</div>
          ${expiryBlock}
          <div style="margin-top:18px"><a href="/plans.html?dialect=${encodeURIComponent(user.dialect || 'eg')}" class="btn btn-primary">${user.tier==='explorer'?'Choose a plan':'Change plan'} &rarr;</a></div>
        </div>
      </div>
    </div>

    <div class="card reveal d3" style="margin-top:18px">
      <h3 class="sec">Your plans, dialect by dialect</h3>
      <p style="color:var(--muted);font-size:.9rem;margin-top:-8px">A plan is bought for one dialect and stays with it &mdash; buying Advanced for Egyptian does not unlock Hejazi. Here is what you hold in each, and you can take out a plan in any of them.</p>
      <div id="all-dialect-plans" style="display:grid;gap:10px;margin-top:14px"></div>
    </div>

    <div class="card reveal d3" style="margin-top:18px">
      <h3 class="sec">Learning dialect</h3>
      <p style="color:var(--muted);font-size:.9rem;margin-top:-8px">Choose which Arabic you want to learn. Every phrase and the voice follow your choice. Your progress, streak and leaderboard place stay exactly the same &mdash; there is one shared leaderboard for all dialects.</p>
      <div id="dialect-picker" style="display:grid;gap:10px;margin-top:14px"></div>
      <div id="dialect-status" style="margin-top:10px;font-size:.85rem;color:var(--accent)"></div>
    </div>

    <div class="card reveal d3" style="margin-top:18px">
      <h3 class="sec">Suggest something to us</h3>
      <p style="color:var(--muted);font-size:.9rem;margin-top:-8px">Ideas, topics you'd like added, or anything that would make Tabib Talk better for you. We read every note.</p>
      <form id="rec-form">
        <div class="field"><textarea id="rec-msg" rows="4" placeholder="Your feedback…" required></textarea></div>
        <button type="submit" class="btn btn-accent">Send feedback</button>
      </form>
      <div id="rec-status"></div>
    </div>

    ${proofs.length ? `<div class="card reveal d4" style="margin-top:18px">
      <h3 class="sec">Payment history</h3>
      ${proofs.map(p=>`<div class="proof-row">
        <div><div style="font-weight:600">${p.planId} <span style="color:var(--muted);font-weight:500;font-size:.8rem">(${p.method})</span></div>
        <div style="color:var(--muted);font-size:.8rem">${fmtDate(p.submittedAt)}</div></div>
        <span class="pill pill-${p.status==='approved'?'active':(p.status==='rejected'?'rejected':'pending')}">${p.status}</span>
      </div>`).join('')}
    </div>` : ''}

    <div style="margin-top:22px"><button class="btn btn-ghost" id="logout-btn">Log out</button></div>
  `;

  /* ---- Your plans, dialect by dialect ----
     user.dialects comes straight from /api/auth/me — the account's own
     entitlement in each of the three dialects, not just the one it is
     currently in. Falls back to reading "no plan yet" (this dialect's
     baseline) when a dialect is entirely absent from the map, which is the
     normal case for a dialect the student has never touched. */
  (function(){
    const ORDER = ['eg', 'hejazi', 'khaleeji'];
    const box = document.getElementById('all-dialect-plans');
    if (!box) return;
    const dialects = user.dialects || {};
    box.innerHTML = ORDER.map((d) => {
      const ent = dialects[d] || { tier: (d === (user.dialect || 'eg') ? user.tier : 'explorer'), planId: null, planExpiresAt: null };
      const label = planLabelFor(ent.planId, ent.tier);
      const isCurrent = d === (user.dialect || 'eg');
      const exp = ent.tier === 'lifetime' ? 'Never expires'
        : (ent.planExpiresAt ? ('Until ' + fmtDate(ent.planExpiresAt)) : 'Free — no expiry');
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;'
        + 'background:' + (isCurrent ? 'var(--accent-soft, rgba(45,212,191,.10))' : 'var(--surface)') + ';'
        + 'border:1.5px solid ' + (isCurrent ? 'var(--accent)' : 'var(--border)') + '">'
        + '<div><b>' + DIALECT_NAMES[d] + '</b>' + (isCurrent ? ' <span style="color:var(--accent);font-size:.78rem">&#10003; current</span>' : '')
        + '<div style="color:var(--muted);font-size:.85rem;margin-top:2px">' + label + ' &middot; ' + exp + '</div></div>'
        + '<a href="/plans.html?dialect=' + encodeURIComponent(d) + '" style="text-decoration:none;flex:none">'
        + '<button class="pill outline" style="cursor:pointer">' + (ent.tier === 'explorer' || ent.tier === 'basic' ? 'Choose a plan' : 'Change plan') + '</button></a>'
        + '</div>';
    }).join('');
  })();

  /* ---- Learning dialect ----
     Stored in the same tt_dialect key the app reads, so switching here changes
     every phrase and the voice the next time the app is opened. Progress and
     the leaderboard are dialect-independent and are never touched. */
  (function(){
    const DIALECTS = [
      ['eg',       '🇪🇬 Egyptian',        'Masri — the original course'],
      ['hejazi',   '🇸🇦 Saudi (Hejazi)',  'Western Saudi — Jeddah, Makkah, Madinah'],
      ['khaleeji', '🌊 Gulf (Khaleeji)',  'Kuwait, UAE, Qatar, Bahrain, eastern Saudi'],
    ];
    function current(){
      try { const d = JSON.parse(localStorage.getItem('tt_dialect')||'null');
            return DIALECTS.some(x=>x[0]===d) ? d : 'eg'; } catch(e){ return 'eg'; }
    }
    function render(){
      const cur = current();
      document.getElementById('dialect-picker').innerHTML = DIALECTS.map(d=>`
        <button type="button" data-d="${d[0]}" style="text-align:left;padding:13px 15px;border-radius:12px;cursor:pointer;font:inherit;color:var(--text);
          background:${d[0]===cur?'var(--accent-soft, rgba(45,212,191,.10))':'var(--surface)'};
          border:1.5px solid ${d[0]===cur?'var(--accent)':'var(--border)'}">
          <b>${d[1]}</b>${d[0]===cur?' <span style="color:var(--accent);font-size:.8rem">&#10003; current</span>':''}
          <br><small style="color:var(--muted)">${d[2]}</small>
        </button>`).join('');
      document.querySelectorAll('#dialect-picker button').forEach(b=>{
        b.addEventListener('click', async ()=>{
          const pick = b.dataset.d;
          if (pick === current()) return;
          const name = (DIALECTS.find(x=>x[0]===pick)||[])[1] || '';
          const statusEl = document.getElementById('dialect-status');
          statusEl.textContent = 'Switching…';
          try {
            // Recorded server-side, not just in this browser: a purchase belongs
            // to the dialect it was made in and stays parked there, so the server
            // swaps in whatever this student holds in the dialect they picked —
            // its baseline if they have never bought there. Switching back later
            // restores exactly what they paid for; nothing is ever forfeited.
            const r = await api('/api/auth/dialect', { method:'POST', body:{ dialect: pick } });
            try { localStorage.setItem('tt_dialect', JSON.stringify(pick)); } catch(e){}
            render();
            const tier = (r && r.user && r.user.tier) ? r.user.tier : '';
            statusEl.innerHTML = 'Switched to <b>' + name + '</b>'
              + (tier ? ' — your plan here is <b>' + tier + '</b>.' : '.')
              + ' <a href="/app.html" style="color:var(--accent)">Open the website</a> to see it applied.';
          } catch (e) {
            statusEl.innerHTML = '<span style="color:var(--gold)">Could not switch just now — please try again.</span>';
          }
        });
      });
    }
    render();
  })();

  document.getElementById('rec-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    try {
      await api('/api/recommendations/submit', { method:'POST', body:{ message: document.getElementById('rec-msg').value } });
      document.getElementById('rec-status').innerHTML = '<div class="alert alert-success" style="margin-top:14px">Thank you — your recommendation has been sent to us.</div>';
      document.getElementById('rec-form').reset();
    } catch(err){ document.getElementById('rec-status').innerHTML = `<div class="alert alert-error" style="margin-top:14px">${err.message}</div>`; }
  });
  document.getElementById('logout-btn').addEventListener('click', async ()=>{ await api('/api/auth/logout', {method:'POST'}); window.location.href='/index.html'; });
})();
</script>
</body>
</html>
